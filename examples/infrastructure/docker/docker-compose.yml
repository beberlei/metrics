# Templates to factorize the service definitions
x-templates:
    worker_base: &worker_base
        build:
            context: services/php
            target: worker
        user: "${USER_ID}:${USER_ID}"
        environment:
            - APP_ENV
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - "../..:/var/www:cached"
        profiles:
            - worker

volumes:
    grafana-data: {}
    graphite-data: {}
    influxdb-data: {}
    influxdb2-data: {}
    postgres-data: {}
    prometheus-data: {}

services:
    postgres:
        image: postgres:16
        environment:
            - POSTGRES_USER=app
            - POSTGRES_PASSWORD=app
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default

    frontend:
        build:
            context: services/php
            target: frontend
            cache_from:
              - "type=registry,ref=${REGISTRY:-}/frontend:cache"
        user: "${USER_ID}:${USER_ID}"
        environment:
            - APP_ENV
            # Fake credentials, and endpoint override pointing at LocalStack,
            # so the "cloudwatch" collector talks to it instead of real AWS.
            # Both are read natively by the AWS SDK for PHP.
            - AWS_ENDPOINT_URL=http://localstack:4566
            - AWS_ACCESS_KEY_ID=test
            - AWS_SECRET_ACCESS_KEY=test
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            postgres:
                condition: service_healthy
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.rule=Host(${PROJECT_DOMAINS})"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.tls=true"
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.rule=Host(${PROJECT_DOMAINS})"
            # Comment the next line to be able to access frontend via HTTP instead of HTTPS
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.middlewares=redirect-to-https@file"

    grafana:
        image: grafana/grafana:latest
        volumes:
            - grafana-data:/var/lib/grafana
            - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-grafana.rule=Host(`grafana.${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-grafana.tls=true"
        profiles:
            - default

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - graphite-data:/opt/graphite/storage
        expose:
            - 80
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-graphite.rule=Host(`graphite.${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-graphite.tls=true"
        profiles:
            - default

    influxdb1:
        image: influxdb:1.8
        environment:
            - INFLUXDB_DB=app
        volumes:
            - influxdb-data:/var/lib/influxdb
        profiles:
            - default

    influxdb2:
        image: influxdb:2.9
        environment:
            - DOCKER_INFLUXDB_INIT_MODE=setup
            - DOCKER_INFLUXDB_INIT_USERNAME=app
            - DOCKER_INFLUXDB_INIT_PASSWORD=app12345
            - DOCKER_INFLUXDB_INIT_ORG=app
            - DOCKER_INFLUXDB_INIT_BUCKET=app
            - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=app-token
        volumes:
            - influxdb2-data:/var/lib/influxdb2
        profiles:
            - default

    # Emulates the AWS API locally, so the "cloudwatch" collector (and its
    # Grafana dashboard) work out of the box, without an AWS account.
    # Pinned (not "latest"): since LocalStack 2026.3.0 (March 2026), the
    # image requires a LOCALSTACK_AUTH_TOKEN even for community/free
    # features. 4.14.0 predates that change and is the first version that
    # understands the AWS-JSON-protocol PutMetricData requests sent by
    # current versions of aws/aws-sdk-php (CloudWatch migrated away from
    # its legacy query/XML protocol in aws-sdk-php 3.370.0).
    localstack:
        image: localstack/localstack:4.14.0
        environment:
            - SERVICES=cloudwatch
        profiles:
            - default

    prometheus:
        image: prom/prometheus:v3.7.2
        # --web.enable-otlp-receiver: the "opentelemetry" collector exports
        # metrics as OTLP/HTTP directly to Prometheus, at /api/v1/otlp.
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-otlp-receiver
        volumes:
            - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:cached
            - prometheus-data:/var/lib/prometheus
        profiles:
            - default

    builder:
        build:
            context: services/php
            target: builder
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/builder:cache"
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            - APP_ENV
            # The following list contains the common environment variables exposed by CI platforms
            - GITHUB_ACTIONS
            - CI # Travis CI, CircleCI, Cirrus CI, Gitlab CI, Appveyor, CodeShip, dsari
            - CONTINUOUS_INTEGRATION # Travis CI, Cirrus CI
            - BUILD_NUMBER # Jenkins, TeamCity
            - RUN_ID # TaskCluster, dsari
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            - postgres
        profiles:
            - builder
