# Grafana datasource provisioning.
#
# One datasource per external backend used by a beberlei/metrics collector.
# Each has a stable `uid` so the dashboards in ../dashboards/ can reference
# them deterministically, and so the app can deep-link to dashboards.
#
# See https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources

apiVersion: 1

datasources:
    # Backs the "dbal" collector (config/packages/metrics.yaml), which
    # writes rows into the "metrics" table (see src/Entity/Metrics.php).
    - name: PostgreSQL (dbal collector)
      uid: pg-metrics
      type: postgres
      access: proxy
      url: postgres:5432
      user: app
      jsonData:
          database: app
          sslmode: disable
          postgresVersion: 1600
      secureJsonData:
          password: app

    # Backs the "prometheus" collector. The app exposes its metrics for
    # scraping at /prometheus (see src/Controller/PrometheusController.php
    # and infrastructure/docker/services/prometheus/prometheus.yml).
    - name: Prometheus
      uid: prom-metrics
      type: prometheus
      access: proxy
      url: http://prometheus:9090

    # Backs the "graphite", "statsd" and "dogstatsd" collectors: they all
    # write into the same graphite-statsd container, just under different
    # metric name prefixes.
    - name: Graphite
      uid: graphite-metrics
      type: graphite
      access: proxy
      url: http://graphite:80
      jsonData:
          graphiteVersion: '1.1'

    # Backs the "influxdb_v1" collector.
    - name: InfluxDB (v1)
      uid: influxdb-metrics
      type: influxdb
      access: proxy
      url: http://influxdb1:8086
      jsonData:
          version: InfluxQL
          dbName: app
          httpMode: GET

    # Backs the "influxdb_v2" collector.
    - name: InfluxDB (v2)
      uid: influxdb2-metrics
      type: influxdb
      access: proxy
      url: http://influxdb2:8086
      jsonData:
          version: Flux
          organization: app
          defaultBucket: app
          httpMode: POST
      secureJsonData:
          token: app-token

    # Backs the "cloudwatch" collector. Points at LocalStack (see
    # infrastructure/docker/docker-compose.yml), not real AWS, with fake
    # credentials matching the ones LocalStack accepts by default.
    - name: CloudWatch (LocalStack)
      uid: cloudwatch-metrics
      type: cloudwatch
      jsonData:
          authType: keys
          defaultRegion: us-east-1
          endpoint: http://localstack:4566
      secureJsonData:
          accessKey: test
          secretKey: test
