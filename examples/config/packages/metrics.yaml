beberlei_metrics:
    default: logger
    collectors:
        influxdb_v1:
            type: influxdb_v1
            host: influxdb1
            database: app
        influxdb_v2:
            type: influxdb_v2
            host: influxdb2
            token: app-token
            org: app
            bucket: app
        cloudwatch:
            type: cloudwatch
            # Points at LocalStack (see infrastructure/docker/docker-compose.yml
            # and the AWS_* environment variables on the "frontend" service),
            # not real AWS.
            region: us-east-1
            namespace: app
        prometheus:
            type: prometheus
            host: prometheus
            service: Prometheus\CollectorRegistry
            namespace: app
        otel:
            type: opentelemetry
            service: OpenTelemetry\API\Metrics\MeterProviderInterface
            namespace: app
        graphite:
            type: graphite
            host: graphite
        statsd:
            type: statsd
            host: graphite
            prefix: 'app.statsd.'
        dogstatsd:
            type: dogstatsd
            host: graphite
            prefix: 'app.dogstatsd.'
        chain:
            type: chain
            # Dispatches every call to both StatsD collectors in one shot;
            # already visible on the Graphite dashboard, no extra wiring.
            collectors: [statsd, dogstatsd]
        dbal:
            type: doctrine_dbal
        logger:
            type: logger
        memory:
            type: memory
        'null':
            type: 'null'
