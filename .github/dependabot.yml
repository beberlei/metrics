version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    - package-ecosystem: 'composer'
      directories:
          - '/'
          - '/tools/*'
          - '/examples'
          - '/examples/tools/*'
      schedule:
          interval: 'monthly'
      groups:
          composer:
              patterns:
                  - '*'
          composer-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    - package-ecosystem: 'docker'
      directories:
          - '/examples/infrastructure/docker/services/php'
          - '/examples/infrastructure/docker/services/router'
      schedule:
          interval: 'monthly'
      groups:
          docker:
              patterns:
                  - '*'
          docker-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7
